# AFC (Automated Filament Changer) Configuration and Macros

[AFC]
enabled: True

[AFC_unit U1]
enabled: True

[AFC_lane E0]
unit: U1
lane: 0
extruder: extruder
toolhead_sensor: filament_motion_sensor e0_filament

[AFC_lane E1]
unit: U1
lane: 1
extruder: extruder1
toolhead_sensor: filament_motion_sensor e1_filament

[AFC_lane E2]
unit: U1
lane: 2
extruder: extruder2
toolhead_sensor: filament_motion_sensor e2_filament

[AFC_lane E3]
unit: U1
lane: 3
extruder: extruder3
toolhead_sensor: filament_motion_sensor e3_filament

[gcode_macro SET_COLOR]
gcode:
    {% set lane = params.LANE|default('E0') %}
    {% set color = params.COLOR|default('FFFFFFFF') %}
    {% set index = printer['AFC_lane ' + lane].lane %}
    SET_PRINT_FILAMENT_CONFIG CONFIG_EXTRUDER='{index}' FILAMENT_COLOR_RGBA='{color}'

[gcode_macro SET_MATERIAL]
gcode:
    {% set lane = params.LANE|default('E0') %}
    {% set material = params.MATERIAL|default('PLA') %}
    {% set subtype = params.SUBTYPE|default('') %}
    {% set index = printer['AFC_lane ' + lane].lane %}
    {% set vendor = printer.print_task_config.filament_vendor[index|int]|default('NONE') %}
    {% if vendor == 'NONE' %}{% set vendor = 'Generic' %}{% endif %}
    SET_PRINT_FILAMENT_CONFIG CONFIG_EXTRUDER='{index}' FILAMENT_TYPE='{material}' FILAMENT_SUBTYPE='{subtype}' VENDOR='{vendor}'

[gcode_macro SET_VENDOR]
gcode:
    {% set lane = params.LANE|default('E0') %}
    {% set vendor = params.VENDOR|default('NONE') %}
    {% set index = printer['AFC_lane ' + lane].lane %}
    SET_PRINT_FILAMENT_CONFIG CONFIG_EXTRUDER='{index}' VENDOR='{vendor}'

[gcode_macro SET_MAP]
description: Feed one of the printer's 32 logical tools from a lane
# Only the tool being assigned is touched. The lane it used to be fed from keeps whatever else it
# feeds, and a lane may feed several tools: that is how a file using more tools than the printer
# has lanes prints at all. Handing the lane's old tool back to another lane, which is what this
# used to do, is what limited a print to four tools.
gcode:
    {% set lane = params.LANE|default('E0') %}
    {% set tool = params.MAP|default('T0') %}
    {% set index = printer['AFC_lane ' + lane].lane %}
    {% set logical_tool = tool[1:] if tool.startswith('T') else '0' %}
    SET_PRINT_EXTRUDER_MAP CONFIG_EXTRUDER='{logical_tool}' MAP_EXTRUDER='{index}'

[gcode_macro AFC_TOOLS_IN_PLAY]
description: How many of the printer's 32 logical tools the file about to print uses
# The map table is always 32 entries long and every entry a file never sets still reads as lane 0,
# so without this the first lane claims every tool the print does not use and the panel lists
# T0 through T30 on one lane. Only the web interface has the file, so it says how far into the
# table this print reaches; 0 means no file is in play and each lane reports its own tool.
variable_count: 0
gcode:
    SET_GCODE_VARIABLE MACRO=AFC_TOOLS_IN_PLAY VARIABLE=count VALUE={params.COUNT|default(0)|int}

[gcode_macro SET_WEIGHT]
gcode:
    { action_raise_error("SET_WEIGHT is not supported.") }

[gcode_macro CHANGE_TOOL]
description: Change tool/lane with automatic load/unload
gcode:
    {% set lane = params.LANE|default('E0') %}
    {% set index = printer['AFC_lane ' + lane].lane %}
    M118 Changing to {lane} (index {index})...
    AUTO_FEEDING EXTRUDER={index} LOAD=1
    M118 Tool change to {lane} complete

[gcode_macro LANE_UNLOAD]
description: Eject (dock) the tool mounted on the carrier for this lane
gcode:
    {% set lane = params.LANE|default('E0') %}
    {% set index = printer['AFC_lane ' + lane].lane %}
    {% set suffix = '' if index|int == 0 else index|int %}
    M118 Ejecting {lane} (parking extruder {index})...
    PARK_EXTRUDER{suffix}
    M118 Eject {lane} complete

[gcode_macro TOOL_UNLOAD]
description: Unload filament from the tool
gcode:
    {% set lane = params.LANE|default('E0') %}
    {% set index = printer['AFC_lane ' + lane].lane %}
    M118 Unloading {lane} (lane {index})...
    AUTO_FEEDING EXTRUDER={index} UNLOAD=1
    M118 Unload {lane} complete
